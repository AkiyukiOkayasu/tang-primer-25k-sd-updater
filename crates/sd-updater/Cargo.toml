[package]
name = "sd-updater"
version = "0.1.0"
edition = "2024"
description = "SD card firmware updater core for Gowin FPGA + PicoRV32 (no_std)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AkiyukiOkayasu/gowin-sd-updater"
keywords = ["fpga", "sd", "firmware", "updater", "gowin"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
embedded-hal = "1.0.0"
embedded-sdmmc = { version = "0.9.0", default-features = false }

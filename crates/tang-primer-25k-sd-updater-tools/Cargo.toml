[package]
name = "tang-primer-25k-sd-updater-tools"
version = "0.2.0"
edition = "2024"
description = "Host CLI for tang-primer-25k-sd-updater: create update packages and factory flash images"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AkiyukiOkayasu/tang-primer-25k-sd-updater"
keywords = ["fpga", "sd", "firmware", "updater", "flash"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
tang-primer-25k-sd-updater = { path = "../tang-primer-25k-sd-updater", version = "0.2.0" }
tang-primer-25k-sd-updater-build = { path = "../tang-primer-25k-sd-updater-build", version = "0.2.0" }

[package]
name = "tang-primer-25k-sd-updater"
version = "0.2.0"
edition = "2024"
description = "SD card firmware updater core for FPGAs (no_std)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AkiyukiOkayasu/tang-primer-25k-sd-updater"
keywords = ["fpga", "sd", "firmware", "updater"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
embedded-hal = "1.0.0"
embedded-sdmmc = { version = "0.10.0", default-features = false }

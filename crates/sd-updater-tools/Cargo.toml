[package]
name = "sd-updater-tools"
version = "0.1.0"
edition = "2024"
description = "Host CLI for sd-updater: create update packages and factory flash images"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AkiyukiOkayasu/gowin-sd-updater"
keywords = ["fpga", "sd", "firmware", "updater", "flash"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
sd-updater = { path = "../sd-updater", version = "0.1.0" }
sd-updater-build = { path = "../sd-updater-build", version = "0.1.0" }

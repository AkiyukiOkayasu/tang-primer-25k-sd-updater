[package]
name = "tang-primer-25k-sd-updater-build"
version = "0.2.0"
edition = "2024"
description = "Build helper for tang-primer-25k-sd-updater: generate Rust constants from update_spec.toml"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AkiyukiOkayasu/tang-primer-25k-sd-updater"
keywords = ["fpga", "sd", "firmware", "updater", "build"]
categories = ["embedded", "development-tools::build-utils", "hardware-support"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1"

[lib]
path = "src/lib.rs"
